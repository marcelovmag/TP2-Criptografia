<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Certificados</title>
    <style>
        body { width: 780px; font-family: 'Segoe UI', sans-serif; padding: 10px; font-size: 13px; }
        h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top: 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
        
        /* Estilos para colunas específicas */
        .col-check { width: 30px; text-align: center; }
        .col-thumb { font-family: monospace; font-size: 11px; color: #555; }
        .has-key { color: green; font-weight: bold; }
        .no-key { color: #ccc; }

        .footer { margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 10px 20px; background-color: #0078d4; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #005a9e; }
        #status { font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <h2>Certificados do Windows (CurrentUser/My)</h2>
    
    <div id="loading">Carregando dados...</div>

    <table id="certTable" style="display:none;">
        <thead>
            <tr>
                <th class="col-check"><input type="checkbox" id="selectAll"></th>
                <th>Assunto (Subject)</th>
                <th>Emissor (Issuer)</th>
                <th>Validade</th>
                <th>Thumbprint</th>
                <th>Chave</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <div class="footer">
        <div id="status"></div>
        <button id="btnSave">Salvar Seleção</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
